services:
  ai-customer-support:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-customer-support:latest
    container_name: ai-customer-support
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
